[package]
name = "openat-cli"
version = "0.1.0"
edition = "2021"
description = "CLI entry point for openat"
authors = ["openat developers"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
clap = { version = "4.4", features = ["derive"] }

# Internal crates
openat-common = { path = "../openat-common" }
openat-types = { path = "../openat-types" }
openat-config = { path = "../openat-config" }
openat-runtime = { path = "../openat-runtime" }
openat-tools = { path = "../openat-tools" }
openat-channels = { path = "../openat-channels" }
openat-providers = { path = "../openat-providers" }
openat-agent = { path = "../openat-agent" }
