[package]
name = "openat-agent"
version = "0.1.0"
edition = "2021"
description = "Agent module for openat"
authors = ["openat developers"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }

# Internal crates
openat-types = { path = "../openat-types" }
openat-runtime = { path = "../openat-runtime" }
openat-config = { path = "../openat-config" }
openat-providers = { path = "../openat-providers" }
openat-tools = { path = "../openat-tools" }
