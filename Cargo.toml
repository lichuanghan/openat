[workspace]
resolver = "2"
members = [
    "crates/openat-common",
    "crates/openat-types",
    "crates/openat-config",
    "crates/openat-runtime",
    "crates/openat-tools",
    "crates/openat-channels",
    "crates/openat-providers",
    "crates/openat-agent",
    "crates/openat-cli",
    "crates/openat-mcp",
]

[workspace.dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
futures-util = "0.3"
async-stream = "0.3"
regex = "1.10"

# Shared by multiple crates
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
